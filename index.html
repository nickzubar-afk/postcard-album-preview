<!doctype html>
<html lang="ru">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha384-f/SpxTZ3Gl7ngAStv0Orh9khbtg33Pz8lTyagud5WLpeBQ9XDWEtve/Odhj48Yu+' 'sha384-7Y7/o57b6QUoQgUjtWdsENLOJvB04gaQDwj1MkElxLaACCdKGFAilELByv6xAjic'; style-src 'self'; img-src data:; media-src blob:; connect-src 'self'; frame-src 'self'; worker-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>За кадром · Живой альбом</title>
  <script src="album-aligned-v3.js" integrity="sha384-f/SpxTZ3Gl7ngAStv0Orh9khbtg33Pz8lTyagud5WLpeBQ9XDWEtve/Odhj48Yu+"></script>
  <script defer src="stream-smooth.js" integrity="sha384-7Y7/o57b6QUoQgUjtWdsENLOJvB04gaQDwj1MkElxLaACCdKGFAilELByv6xAjic"></script>
</head>
<body>
  <main class="cover" id="main">
    <header class="mast"><span class="brand"><i class="book-mark" aria-hidden="true"></i>Живой альбом</span><button id="lock" class="text-btn" hidden>Закрыть доступ</button></header>
    <section class="spread">
      <div class="book" aria-hidden="true"><div class="book-spine"></div><div class="book-inset"><div class="motion-mark"><i></i><i></i><i></i></div><div class="book-title">За<br><em>кадром</em></div></div></div>
      <div class="intro">
        <h1 id="title">Альбом закрыт</h1>
        <p id="intro-text" role="status">Чтобы открыть воспоминание, отсканируй QR-код на фотографии или открой личную ссылку.</p>
        <div id="actions" hidden><button id="camera" class="primary">Открыть камеру</button></div>
        <p id="camera-hint" class="hint" hidden></p>
      </div>
    </section>
    <noscript>Для просмотра альбома включи JavaScript в браузере.</noscript>
  </main>
  <section class="overlay" id="scanner" hidden aria-label="Распознавание фотографии">
    <div id="frame"></div>
    <div class="scan-top"><button id="exit-camera">Закрыть камеру</button><button id="scan-voice" hidden>Включить звук</button></div>
    <div class="scan-bottom"><p id="scan-status" role="status"></p><button class="scan-fallback" id="scan-play" hidden>Запустить ролик</button><button class="scan-fallback" id="scan-retry" hidden>Попробовать ещё раз</button></div>
  </section>
</body>
</html>
